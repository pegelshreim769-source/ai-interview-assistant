services:
  app:
    build:
      context: .
      dockerfile: Dockerfile
    image: interview-studio:latest
    restart: unless-stopped
    env_file:
      - ${ENV_FILE:-.env.production}
    environment:
      NODE_ENV: production
      PORT: 3000
      HOSTNAME: 0.0.0.0
    ports:
      - "127.0.0.1:3000:3000"
    volumes:
      - session_data:/app/.data
    depends_on:
      redis:
        condition: service_healthy
    healthcheck:
      test:
        - CMD
        - node
        - -e
        - fetch('http://127.0.0.1:3000/api/health').then(r=>{if(!r.ok)process.exit(1)}).catch(()=>process.exit(1))
      interval: 30s
      timeout: 5s
      retries: 3
      start_period: 20s
    init: true
    logging:
      driver: json-file
      options:
        max-size: "10m"
        max-file: "3"

  redis:
    image: redis:7.4-alpine
    restart: unless-stopped
    command:
      - redis-server
      - --appendonly
      - "yes"
      - --appendfsync
      - everysec
    volumes:
      - redis_data:/data
    healthcheck:
      test: ["CMD", "redis-cli", "ping"]
      interval: 10s
      timeout: 3s
      retries: 5
      start_period: 5s
    logging:
      driver: json-file
      options:
        max-size: "10m"
        max-file: "3"

  invite-admin:
    profiles: ["tools"]
    build:
      context: .
      dockerfile: Dockerfile
      target: invite-admin
    env_file:
      - ${ENV_FILE:-.env.production}
    depends_on:
      redis:
        condition: service_healthy

  admin-tools:
    profiles: ["tools"]
    build:
      context: .
      dockerfile: Dockerfile
      target: invite-admin
    entrypoint: ["node", "--conditions=react-server", "--import", "tsx", "scripts/admin.ts"]
    env_file:
      - ${ENV_FILE:-.env.production}
    depends_on:
      redis:
        condition: service_healthy

  beta-usage-redis-test:
    profiles: ["tools"]
    build:
      context: .
      dockerfile: Dockerfile
      target: invite-admin
    entrypoint: ["node", "--conditions=react-server", "--import", "tsx", "scripts/verify-beta-usage-redis.ts"]
    env_file:
      - ${ENV_FILE:-.env.production}
    depends_on:
      redis:
        condition: service_healthy

  observability-redis-test:
    profiles: ["tools"]
    build:
      context: .
      dockerfile: Dockerfile
      target: invite-admin
    entrypoint: ["node", "--conditions=react-server", "--import", "tsx", "scripts/verify-observability-redis.ts"]
    env_file:
      - ${ENV_FILE:-.env.production}
    depends_on:
      redis:
        condition: service_healthy

  compliance-redis-test:
    profiles: ["tools"]
    build:
      context: .
      dockerfile: Dockerfile
      target: invite-admin
    entrypoint: ["node", "--conditions=react-server", "--import", "tsx", "scripts/verify-compliance-redis.ts"]
    env_file:
      - ${ENV_FILE:-.env.production}
    depends_on:
      redis:
        condition: service_healthy

  beta-usage-http-test:
    profiles: ["tools"]
    build:
      context: .
      dockerfile: Dockerfile
      target: invite-admin
    entrypoint: ["node", "--conditions=react-server", "--import", "tsx", "scripts/verify-beta-usage-http.ts"]
    env_file:
      - ${ENV_FILE:-.env.production}
    depends_on:
      app:
        condition: service_healthy
      redis:
        condition: service_healthy

  compliance-http-test:
    profiles: ["tools"]
    build:
      context: .
      dockerfile: Dockerfile
      target: invite-admin
    entrypoint: ["node", "--conditions=react-server", "--import", "tsx", "scripts/verify-compliance-http.ts"]
    env_file:
      - ${ENV_FILE:-.env.production}
    depends_on:
      app:
        condition: service_healthy
      redis:
        condition: service_healthy

volumes:
  session_data:
  redis_data:
